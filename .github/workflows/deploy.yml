name: Deploy
on:
  push:
    branches:
      - master
      - integration/upstream-elixir-update
  pull_request:
    branches:
      - master

jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    services:
      db:
        image: postgres:17
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: listudy_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Cache mix modules
        uses: actions/cache@v4
        env:
          cache-name: cache-mix-modules
        with:
          path: deps # mix cache files are stored in `deps` in the root of the project folder
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '28'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r priv/python/requirements.txt
      - name: Install Dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
      - name: "Install npm"
        run: npm install --legacy-peer-deps --prefix assets 
      - name: Run Tests
        run: |
          mix compile
          mix ecto.create
          mix ecto.migrate
          mix ecto.reset
          mix test
          mkdir -p priv/static/study_pgn
          npm run deploy --prefix ./assets
          mix phx.digest
  Deploy:
    name: Deploy
    needs: Test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: executing remote ssh commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        script: |
          cd /opt/listudy
          git pull
          ./scripts/prod/ci.sh
